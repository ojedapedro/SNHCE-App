# Helm Values - SNHCE Datacenters (Active-Active)
# Configuraciones preparadas para despliegue en Kubernetes (CANTV / Data Center Alterno)

global:
  environment: production
  domain: snhce.gob.ve

# Backend API
backend:
  replicaCount: 5 # Escalabilidad horizontal base
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 50
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  image:
    repository: registry.snhce.gob.ve/snhce/backend
    tag: "v1.0.0"
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  env:
    - name: NODE_ENV
      value: "production"
  envFromSecrets:
    - name: DB_CREDENTIALS
      secretName: snhce-db-secret
    - name: VAULT_TOKEN
      secretName: snhce-vault-token

# Frontend PWA (Servido vía NGINX Ingress / CDN)
frontend:
  replicaCount: 3
  image:
    repository: registry.snhce.gob.ve/snhce/portal-paciente
    tag: "v1.0.0"

# Redis Cluster (Cache, Rate Limiting, Outbox Sync)
redis:
  architecture: replication
  auth:
    existingSecret: snhce-redis-secret
  master:
    persistence:
      enabled: true
      size: 50Gi

# Ingress Control (HAProxy / Nginx) con TLS 1.3 estricto
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/limit-rps: "10" # Capa de protección L7 adicional
  hosts:
    - host: portal.snhce.gob.ve
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: snhce-frontend
              port: 80
    - host: api.snhce.gob.ve
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: snhce-backend
              port: 3000
