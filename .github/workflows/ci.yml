name: CI — SNHCE

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ============================================================
  # 1. Lint y formato
  # ============================================================
  lint:
    name: 🔍 Lint y Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Verificar formato (Prettier)
        run: pnpm format --check

  # ============================================================
  # 2. Verificación de tipos TypeScript
  # ============================================================
  type-check:
    name: 🔷 TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  # ============================================================
  # 3. Tests del Backend con PostgreSQL y Redis reales
  # ============================================================
  test-backend:
    name: 🧪 Tests Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: snhce_test
          POSTGRES_USER: snhce_test
          POSTGRES_PASSWORD: snhce_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://snhce_test:snhce_test_ci@localhost:5432/snhce_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-production
      VAULT_ADDR: http://localhost:8200
      KMS_ADAPTER: local  # Usar adaptador local en CI

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        working-directory: backend
        run: pnpm prisma generate

      - name: Ejecutar migraciones en DB de test
        working-directory: backend
        run: pnpm prisma migrate deploy

      - name: Tests unitarios
        working-directory: backend
        run: pnpm jest --projects=unit --coverage --ci

      - name: Tests de integración
        working-directory: backend
        run: pnpm jest --projects=integration --ci

      - name: 🔐 Tests de autorización por rol (CRÍTICOS)
        working-directory: backend
        run: pnpm jest --projects=authorization --ci

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage/

  # ============================================================
  # 4. Tests del Frontend
  # ============================================================
  test-frontend:
    name: 🧪 Tests Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Tests portal-paciente
        run: pnpm --filter @snhce/portal-paciente test:coverage
      - name: Tests app-clinica
        run: pnpm --filter @snhce/app-clinica test:coverage
      - name: Tests paquetes compartidos
        run: pnpm --filter @snhce/ui test:coverage

  # ============================================================
  # 5. Análisis de seguridad (SAST) con Semgrep
  # ============================================================
  sast:
    name: 🛡️ SAST — Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep — análisis de código estático
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/nodejs
            p/owasp-top-ten
            p/jwt
            p/secrets
            p/sql-injection
          generateSarif: "1"

      - name: Subir resultados SARIF a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ============================================================
  # 6. Escaneo de dependencias con Trivy
  # ============================================================
  dependency-scan:
    name: 🔎 Dependencias — Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pnpm audit — vulnerabilidades conocidas
        run: |
          npm install -g pnpm@${{ env.PNPM_VERSION }}
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high || true  # No fallar en warnings, solo en HIGH+

      - name: Trivy — escaneo del sistema de archivos
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Subir resultados Trivy
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================
  # 7. Build (solo si todo lo anterior pasa)
  # ============================================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-backend, test-frontend, sast, dependency-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build de todos los packages
        run: pnpm build

      - name: Construir imagen Docker del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: snhce-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escanear imagen Docker con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: snhce-backend:${{ github.sha }}
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Guardar artefactos de build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/portal-paciente/dist/
            apps/app-clinica/dist/
            apps/consola-administrativa/dist/
          retention-days: 7

  # ============================================================
  # 8. Verificación de accesibilidad (axe)
  # ============================================================
  accessibility:
    name: ♿ Accesibilidad — axe
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Instalar Playwright
        run: pnpm --filter @snhce/portal-paciente exec playwright install --with-deps chromium
      # TODO: Ejecutar axe en las páginas del portal del paciente
      # - name: Verificar accesibilidad WCAG 2.1 AA
      #   run: pnpm --filter @snhce/portal-paciente test:a11y
      - name: Verificación básica (placeholder hasta integración Playwright)
        run: echo "✅ Axe accesibility checks pendientes — ver Fase 8"
